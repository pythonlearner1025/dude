[mate]
name = "Kevin"
persona = "../personas/kevin"
voice_server = "http://127.0.0.1:7860"
voice_reference = "../voices/kevin.wav"
voice_seed = 42

[mic]
source = "remote"
barge_in = true
mute_while_speaking = true
save_recordings = false
vad_threshold = 0.5
end_of_speech_silence = 0.1

[remote_mic]
bind = "100.126.232.8"
port = 8091

[stt]
url = "http://127.0.0.1:8083/v1/audio/transcriptions"

# Skill mode (docs/design/kevin-skill-loop.html): no Kev. The actor (DeepSeek V4.1 Flash on
# Together, through OpenRouter) picks Kevin's skills from the library; the coach watches the trace.
[actor]
model = "deepseek/deepseek-v4.1-flash-1017"
provider = "together"
library = "../../kevin-skills"

[llm]
url = "http://127.0.0.1:8081/v1/chat/completions"
temperature = 1.0

[models]
silero_vad = "../../models/silero_vad.onnx"

[game]
bind = "127.0.0.1"
port = 47800

[site]
bind = "100.126.232.8"
port = 8090

[log]
directory = "../logs"
save_audio = true
gpu_interval = 2.0
