[project]
name = "m8py"
version = "0.1.0"
description = "Behaviour-faithful Python port of m8"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "aiohttp>=3.10",
  "httpx>=0.27",
  "numpy>=2.0",
  "pillow>=10.4",
  "sherpa-onnx>=1.10",
  "sounddevice>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.14", "websockets>=13"]

[project.scripts]
m8py = "m8py.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.14", "websockets>=13"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
