Section "ServerLayout"
    Identifier "m8-layout"
    Screen 0 "m8-screen"
EndSection

Section "Device"
    Identifier "nvidia-3090ti"
    Driver "nvidia"
    BusID "PCI:1:0:0"
    Option "AllowEmptyInitialConfiguration" "false"
EndSection

Section "Monitor"
    Identifier "dp4-monitor"
    Option "DPMS" "false"
EndSection

Section "Screen"
    Identifier "m8-screen"
    Device "nvidia-3090ti"
    Monitor "dp4-monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
    EndSubSection
EndSection

Section "ServerFlags"
    Option "AutoAddGPU" "false"
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection
